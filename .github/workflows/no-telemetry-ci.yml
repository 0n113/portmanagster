name: No-Telemetry CI

on:
  push:
    branches: [no-spn-no-telemetry, 'release-candidate/**']
  pull_request:
    branches: [development]

permissions:
  contents: read

jobs:
  full-go-build-and-test:
    name: Full Go Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Download modules
        run: go mod download
      - name: Verify go.mod / go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Build all packages
        run: go build ./...
      - name: Vet all packages
        run: go vet ./...
      # Upstream also runs the suite with -short (see Earthfile +go-test):
      # "long" tests require a full desktop system.
      - name: Test all packages
        run: go test -short -count=1 ./...
      - name: Race check on privacy-critical packages
        run: go test -race -short -count=1 ./service/network/... ./service/netquery/... ./service/sync/...

  no-telemetry-guard:
    name: No telemetry and no network account API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reject known Safing account endpoints
        run: |
          ! grep -RInE 'account\.safing\.io|telemetry\.safing\.io|api\.safing\.io' service/sync
      - name: Reject outbound HTTP clients in sync
        # service/sync serves the local import/export API and needs net/http
        # for status codes, but must never send requests itself.
        run: |
          ! grep -RInE 'http\.Client|http\.NewRequest|http\.(Get|Post|Head|PostForm)\(|DefaultClient' service/sync
      - name: Reject Safing online check and tracking parameters
        run: |
          ! grep -RIn --include='*.go' 'online-check\.safing\.io' service base
          ! grep -RIn 'source=Portmaster' service base desktop/angular/src desktop/angular/projects desktop/tauri/src-tauri/src
      - name: Reject the Safing support hub in the UI
        run: |
          ! grep -RIn 'support\.safing\.io' desktop/angular/src desktop/angular/projects
      - name: Reject the removed SPN code
        run: |
          test ! -e spn
          ! grep -RInE --include='*.go' '^[[:space:]]*(import[[:space:]]+)?([[:alnum:]_.]+[[:space:]]+)?"github.com/safing/portmaster/spn' .
      - name: Reject subscription gating of settings
        run: |
          ! grep -RIn --include='*.go' 'RequiresFeatureIDAnnotation:' service
      - name: Ensure the obsolete login testsuite is excluded
        run: grep -q '^//go:build ignore$' cmds/testsuite/login.go

  angular-ui-build:
    name: Angular UI Build (no account API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/angular
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/angular/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Reject account/SPN API calls in the API library
        run: |
          ! grep -RInE 'v1/spn/account|v1/account/features|account\.safing\.io|core:spn/account' projects/safing/portmaster-api/src
      - name: Build libraries and UI
        run: npm run build
      - name: Reject account API calls in the production bundle
        run: |
          ! grep -lE 'v1/spn/account|v1/account/features' dist/*.js

  tauri-clippy:
    name: Tauri (Rust) clippy, no warnings
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop/tauri/src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libsoup-3.0-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev
      # Same Rust version as the builds (rust_version in the Earthfile), so
      # that a new stable release cannot break this job without a change
      # here.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.89"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop/tauri/src-tauri -> target
          key: clippy-linux
      - name: Create empty UI dist so the build script is satisfied
        run: mkdir -p ../../angular/dist/tauri-builtin
      - name: Clippy (all targets, deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Reject SPN leftovers in the tray/UI shell
        run: |
          ! grep -rnE 'spn_toggle|set_spn_enabled|SPNStatus|models::spn' src

  tauri-clippy-windows:
    # The Windows-only code of the UI (notifications, service control) is not
    # compiled by the Linux job, so check it for the target of the installer.
    name: Tauri (Rust) clippy for Windows, no warnings
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop/tauri/src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install MinGW cross toolchain
        # A hanging mirror once blocked this step until the job timeout.
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq --no-install-recommends mingw-w64
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.89"
          targets: x86_64-pc-windows-gnu
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop/tauri/src-tauri -> target
          key: clippy-windows
      - name: Create empty UI dist so the build script is satisfied
        run: mkdir -p ../../angular/dist/tauri-builtin
      - name: Clippy (Windows target, deny warnings)
        run: cargo clippy --target x86_64-pc-windows-gnu --all-features -- -D warnings
