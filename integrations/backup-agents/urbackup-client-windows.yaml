# UrBackup client on Windows, same ports as on Linux. Allow only the backup server 192.168.1.10.
type: profile
source: local
name: UrBackup client
fingerprints:
  - type: path
    operation: equals
    value: C:\Program Files\UrBackup\UrBackupClientBackend.exe
config:
  filter:
    blockInbound: false
    serviceEndpoints:
      - "+ 192.168.1.10 TCP/35621"
      - "+ 192.168.1.10 TCP/35623"
      - "+ 192.168.1.10 UDP/35622"
      - "- *"
    endpoints:
      - "+ 192.168.1.10 TCP/55413-55415"
      - "+ 192.168.1.10 UDP/35622"
      - "- *"
