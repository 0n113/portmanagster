<!-- Add inside <ossec_config> of the agent's ossec.conf (Linux: /var/ossec/etc/ossec.conf),
     or push it centrally via agent.conf (command monitoring from the manager requires
     wazuh_command.remote_commands=1 on the agent). -->

<!-- Connection log written by portmaster-connections-export.timer (one JSON object per line). -->
<localfile>
  <log_format>json</log_format>
  <location>/var/log/portmaster/connections.json</location>
</localfile>

<!-- Health check: output starts with OK:/WARNING:/CRITICAL:/UNKNOWN:. -->
<localfile>
  <log_format>full_command</log_format>
  <command>/usr/lib/portmaster/portmaster-core status --check</command>
  <alias>portmaster-status</alias>
  <frequency>300</frequency>
</localfile>
