{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Portmanagster</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="/">Portmanagster</a>
  {{if .CSRF}}
  <div class="who">
    <span>{{.Admin.Name}} <span class="role">{{.Admin.Role}}</span></span>
    <form method="post" action="/logout">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <button type="submit" class="link">Log out</button>
    </form>
  </div>
  {{end}}
</header>
<main>
  {{if .Error}}<p class="msg error" role="alert">{{.Error}}</p>{{end}}
  {{if .Notice}}<p class="msg notice" role="status">{{.Notice}}</p>{{end}}
  {{template "content" .}}
</main>
</body>
</html>
{{end}}
