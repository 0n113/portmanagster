{{define "content"}}
<section class="card narrow">
  <h1>Log in</h1>
  <button type="button" id="passkey-login" class="primary">Log in with a passkey</button>
  <p class="msg error" id="passkey-error" role="alert" hidden></p>
  <div class="divider"><span>or with a code from your authenticator app</span></div>
  <form method="post" action="/login/totp">
    <label>Account <input name="name" autocomplete="username" required></label>
    <label>Code <input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" required></label>
    <button type="submit">Log in with code</button>
  </form>
</section>
{{end}}
